[aqt]
baseurl : https://qt.mirror.constant.com

[requests]
connection_timeout : 6
response_timeout : 30
max_retries_on_connection_error : 2
max_retries_to_retrieve_hash : 2
# Qt 6.8.3 repository publishes .sha1 files, not .sha256 files.
hash_algorithm : sha1

[mirrors]
trusted_mirrors :
    https://qt.mirror.constant.com
fallbacks :
    https://ftp.fau.de/qtproject/
